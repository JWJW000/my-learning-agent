[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-learning-agent"
version = "0.1.0"
description = "A self-learning agent with memory system and skill lifecycle"
requires-python = ">=3.11,<3.16"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "rich>=13.0",
    "textual>=0.70.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
myagent = "main:main"
myagent-tui = "tui_app:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
